rules:
  - id: open_1N
    context:
      auction_pattern: ""
      seat_positions: [1, 2, 3, 4]
    call: 1N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: hcp_in_notrump_range
          evaluator: range_contains
          input: self.hcp
          min: 15
          max: 17
          weight: 60
        - criterion_id: balanced_shape
          evaluator: equals
          input: self.balanced
          value: true
          weight: 40
    meaning:
      call_nature: natural
      action_type: opening
      target_suit: N
      hcp_min: 15
      hcp_max: 17
      shape_class: balanced
      alertable: false
    semantic_effects:
      - fact_type: notrump_opening
        actor_role: opener
        target_suit: N
        hcp_min: 15
        hcp_max: 17
        shape_class: balanced

  - id: open_2N
    context:
      auction_pattern: ""
      seat_positions: [1, 2, 3, 4]
    call: 2N
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: hcp_in_2n_range
          evaluator: range_contains
          input: self.hcp
          min: 20
          max: 21
          weight: 60
        - criterion_id: balanced_shape
          evaluator: equals
          input: self.balanced
          value: true
          weight: 40
    meaning:
      call_nature: natural
      action_type: opening
      target_suit: N
      hcp_min: 20
      hcp_max: 21
      shape_class: balanced
      alertable: false
    semantic_effects:
      - fact_type: notrump_opening
        actor_role: opener
        target_suit: N
        hcp_min: 20
        hcp_max: 21
        shape_class: balanced


