rules:
  - id: open_1H_seat_1_2
    context:
      auction_pattern: ""
      seat_positions: [1, 2]
    call: 1H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: opening_values
          evaluator: min_value
          input: self.hcp
          min: 12
          weight: 40
        - criterion_id: five_card_heart_length
          evaluator: min_value
          input: self.hearts
          min: 5
          weight: 60
    meaning:
      call_nature: natural
      action_type: opening
      target_suit: H
      shown_length_min: 5
      alertable: false

