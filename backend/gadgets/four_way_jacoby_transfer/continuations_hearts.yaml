rules:
  - id: complete_hearts
    context:
      auction_pattern: "1NP2DP"
      seat_positions: [1, 2, 3, 4]
    call: 2H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: pending_heart_transfer
          evaluator: fact_exists
          query:
            fact_type: transfer
            target_suit: H
            status: pending
          weight: 80
    meaning:
      call_nature: conventional
      action_type: transfer_completion
      target_suit: H
      alertable: false
    semantic_effects:
      - fact_type: transfer_completion
        target_suit: H
        status: completed

  - id: superaccept_hearts
    context:
      auction_pattern: "1NP2DP"
      seat_positions: [1, 2, 3, 4]
    call: 3H
    selection:
      algorithm: weighted_score
      criteria:
        - criterion_id: pending_heart_transfer
          evaluator: fact_exists
          query:
            fact_type: transfer
            target_suit: H
            status: pending
          weight: 40
        - criterion_id: maximumish_notrump_values
          evaluator: min_value
          input: self.hcp
          min: 16
          weight: 30
        - criterion_id: four_card_heart_support
          evaluator: min_value
          input: self.hearts
          min: 4
          weight: 30
    meaning:
      call_nature: conventional
      action_type: superaccept
      target_suit: H
      alertable: true
    semantic_effects:
      - fact_type: transfer_superaccept
        target_suit: H
        status: accepted


